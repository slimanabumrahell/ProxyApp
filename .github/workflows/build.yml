name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d

      - name: Fetch hev-socks5-tunnel
        run: |
          git clone --recursive --depth 1 https://github.com/heiher/hev-socks5-tunnel.git app/src/main/jni/hev-socks5-tunnel
          ls app/src/main/jni/hev-socks5-tunnel

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tail -n 80

      - uses: actions/upload-artifact@v4
        with:
          name: ProxyApp-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Fetch hev-socks5-tunnel
        run: |
          git clone --recursive --depth 1 https://github.com/heiher/hev-socks5-tunnel.git app/src/main/jni/hev-socks5-tunnel
          grep -rn "native" app/src/main/jni/hev-socks5-tunnel/src/*.c | grep -i "JNIEXPORT\|Java_" || true
          grep -rn "TProxy" app/src/main/jni/hev-socks5-tunnel/src/hev-jni.c || true
